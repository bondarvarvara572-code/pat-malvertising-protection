apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer-detector
  namespace: pat-ns
  labels:
    app: analyzer-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analyzer-detector
  template:
    metadata:
      labels:
        app: analyzer-detector
        part-of: pat
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8002'
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: analyzer-detector
        image: pat-service:latest
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - services.analyzer_detector.app
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: PORT
          value: '8002'
        - name: PATTERN_CONFIG
          value: /app/config/pattern_config.json
        - name: RESPONSE_URL
          value: http://response-block:8003/decide
        - name: BLOCKLIST_URL
          value: http://response-block:8003/blocklist
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cfg
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: cfg
        configMap:
          name: pattern-config

---
apiVersion: v1
kind: Service
metadata:
  name: analyzer-detector
  namespace: pat-ns
  labels:
    app: analyzer-detector
spec:
  type: ClusterIP
  selector:
    app: analyzer-detector
  ports:
  - name: http
    port: 8002
    targetPort: 8002
