apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: pat-ns

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-reader
  namespace: pat-ns
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-reader
  namespace: pat-ns
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: pat-ns
roleRef:
  kind: Role
  name: prometheus-pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pat-ns
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\nscrape_configs:\n- job_name: pat-pods\n\
    \  kubernetes_sd_configs:\n  - role: pod\n    namespaces:\n      names:\n    \
    \  - pat-ns\n  relabel_configs:\n  - source_labels:\n    - __meta_kubernetes_pod_annotation_prometheus_io_scrape\n\
    \    action: keep\n    regex: 'true'\n  - source_labels:\n    - __address__\n\
    \    - __meta_kubernetes_pod_annotation_prometheus_io_port\n    action: replace\n\
    \    regex: ([^:]+)(?::\\d+)?;(\\d+)\n    replacement: $1:$2\n    target_label:\
    \ __address__\n  - source_labels:\n    - __meta_kubernetes_pod_label_app\n   \
    \ target_label: job\n  - source_labels:\n    - __meta_kubernetes_pod_name\n  \
    \  target_label: pod\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pat-ns
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: cfg
          mountPath: /etc/prometheus
      volumes:
      - name: cfg
        configMap:
          name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pat-ns
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
